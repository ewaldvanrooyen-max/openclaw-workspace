<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#161b22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="static/manifest.json">
    <link rel="icon" type="image/png" href="static/icon-192.png">
    <link rel="apple-touch-icon" href="static/icon-192.png">
    <title>{% block title %}PocketPal{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: #161b22;
            padding: 16px;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 20px;
            color: #58a6ff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }
        .btn-secondary {
            background: #30363d;
        }
        .btn:hover { opacity: 0.9; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 16px;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: space-around;
            padding: 12px;
        }
        .nav a {
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }
        .nav a.active {
            color: #58a6ff;
        }
        .nav-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }
        .message {
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            max-width: 85%;
        }
        .message.user {
            background: #238636;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #21262d;
            border-bottom-left-radius: 4px;
        }
        .chat-messages {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .chat-input {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: #161b22;
            padding: 12px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            margin: 0;
        }
        .chat-input button {
            background: #238636;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .profile-field {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #30363d;
        }
        .profile-field:last-child { border-bottom: none; }
        .profile-label { color: #8b949e; }
        .profile-value { color: #e6edf3; }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: #238636;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 PocketPal</h1>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <nav class="nav">
        <a href="/" class="{{ 'active' if page == 'home' else '' }}">
            <span class="nav-icon">🏠</span>
            Home
        </a>
        <a href="/onboarding" class="{{ 'active' if page == 'onboarding' else '' }}">
            <span class="nav-icon">👤</span>
            Profile
        </a>
        <a href="/chat" class="{{ 'active' if page == 'chat' else '' }}">
            <span class="nav-icon">💬</span>
            Chat
        </a>
    </nav>
    {% block scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('static/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
